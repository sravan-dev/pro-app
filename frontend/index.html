<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tijus SmS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- Preloader: the brand's four dots growing in turn ("loading to success").
         Styled here, not in the CSS bundle, so it shows before the app's JS and
         CSS arrive; components/Preloader.jsx renders the same markup while the
         app checks the session, so the hand-over is seamless. -->
    <style>
      .preloader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: #2E2B70; color: #fff;
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .preloader-dots { display: flex; align-items: center; gap: 12px; height: 34px; }
      .preloader-dots i {
        display: block; border-radius: 50%; transform: scale(0);
        animation: preloader-grow 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      .preloader-dots i:nth-child(1) { width: 13px; height: 13px; background: #F3D011; }
      .preloader-dots i:nth-child(2) { width: 18px; height: 18px; background: #01A1E4; animation-delay: 0.18s; }
      .preloader-dots i:nth-child(3) { width: 23px; height: 23px; background: #77DD77; animation-delay: 0.36s; }
      .preloader-dots i:nth-child(4) { width: 30px; height: 30px; background: #FF0D00; animation-delay: 0.54s; }
      @keyframes preloader-grow {
        0% { transform: scale(0); opacity: 0; }
        22%, 70% { transform: scale(1); opacity: 1; }
        88%, 100% { transform: scale(0); opacity: 0; }
      }
      .preloader-text { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #C9C7E8; }
      @media (prefers-reduced-motion: reduce) {
        .preloader-dots i { animation: none; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="preloader" role="status" aria-live="polite">
        <div class="preloader-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <p class="preloader-text">Loading to success</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
